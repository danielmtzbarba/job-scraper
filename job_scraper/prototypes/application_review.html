<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Application review · Job search</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182321;background:#f3f5f2;--ink:#182321;--muted:#52645b;--line:#dbe5de;--green:#216b4b;--mint:#e8f3ec;--paper:#fff;--warn:#855308}
    *{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}a{color:var(--green)}:focus-visible{outline:3px solid #91c6a4;outline-offset:2px}
    .shell{max-width:1480px;margin:auto;padding:28px 36px 72px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.brand{font-size:13px;font-weight:700;text-decoration:none;color:var(--ink)}.back{font-size:13px;font-weight:600;text-decoration:none}.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-bottom:24px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:32px;line-height:1.15;letter-spacing:-.025em;text-wrap:balance}.company{margin:8px 0 0;color:var(--muted)}.status{border-radius:999px;background:var(--mint);padding:8px 12px;font-size:12px;font-weight:700;color:var(--green);white-space:nowrap}.status[data-status="SubmissionUnverified"]{background:#fff1d8;color:#765009}.status[data-status="NeedsInput"]{background:#fff1d8;color:#765009}
    .steps{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 27px}.step{border:1px solid var(--line);border-radius:999px;padding:7px 11px;background:#fff;color:var(--muted);font-size:12px}.step.current{background:var(--green);border-color:var(--green);color:#fff}.message{border:1px solid #e7d5af;border-radius:12px;padding:13px 16px;background:#fff8ea;color:#5e410d;margin-bottom:20px;line-height:1.5}.message.error{border-color:#e7c5c5;background:#fff3f3;color:#822929}.message[hidden]{display:none}
    .layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(350px,.85fr);gap:22px;align-items:start}.capture,.details{background:var(--paper);border:1px solid var(--line);border-radius:15px;overflow:hidden}.capture-head,.details-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.capture h2,.details h2{margin:0;font-size:17px;letter-spacing:-.01em}.hint{color:var(--muted);font-size:12px}.capture-body{min-height:380px;background:#edf1ed;display:grid;place-items:center;overflow:auto}.capture-body img{display:block;width:100%;height:auto;max-height:900px;object-fit:contain;object-position:top}.empty{max-width:340px;padding:38px 22px;text-align:center;color:var(--muted);line-height:1.5}.details-body{padding:20px}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:20px}.meta-label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.meta-value{font-size:13px;font-weight:650;overflow-wrap:anywhere}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 13px}.section-head h3{margin:0;font-size:15px}.field{margin-bottom:16px}.field label{display:block;font-size:12px;font-weight:650;margin-bottom:6px}.field input:not([type=checkbox]),.field select{width:100%;min-height:41px;border:1px solid #bdcbc1;border-radius:8px;background:#fff;padding:9px 11px;color:var(--ink)}.field small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.field .checkrow{display:flex;align-items:flex-start;gap:9px;line-height:1.45;font-size:13px}.checkrow input{margin-top:2px;accent-color:var(--green)}.consent-confirm{margin:7px 0 0 25px;padding:8px 10px;background:#f4f7f4;border-radius:7px}.answer{padding:11px 0;border-bottom:1px solid #edf0ed}.answer:last-child{border-bottom:0}.answer dt{color:var(--muted);font-size:12px;margin-bottom:4px}.answer dd{margin:0;font-size:13px;font-weight:600;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:9px;padding:18px 20px;border-top:1px solid var(--line)}.btn{min-height:40px;border:1px solid #bfcec3;border-radius:8px;background:#fff;color:var(--ink);padding:8px 13px;font-weight:650;font-size:13px}.btn:hover{background:#f4f8f5}.btn.primary{border-color:var(--green);background:var(--green);color:#fff}.btn.primary:hover{background:#17573a}.btn.danger{color:#923a3a;border-color:#e2c3c3}.btn.danger:hover{background:#fff3f3}.actions .spacer{flex:1}
    @media(max-width:920px){.layout{grid-template-columns:1fr}.capture-body img{max-height:560px}.shell{padding:20px 18px 60px}}@media(max-width:560px){h1{font-size:26px}.heading{align-items:flex-start;flex-direction:column}.capture-head,.details-head,.details-body,.actions{padding-left:15px;padding-right:15px}.meta{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:no-preference){.btn{transition:background .18s ease-out,opacity .18s ease-out}}
  </style>
</head>
<body>
  <main class="shell">
    <nav class="top"><a class="brand" href="/jobs">↗ Job search</a><a class="back" href="/jobs">← Back to jobs</a></nav>
    <header class="heading"><div><h1 id="title">Application review</h1><p class="company" id="company">Loading attempt…</p></div><span class="status" id="status">Loading</span></header>
    <div class="steps" id="steps" aria-label="Application progress"></div>
    <div class="message" id="message" role="status" hidden></div>
    <div class="layout">
      <section class="capture" aria-labelledby="capture-title"><div class="capture-head"><h2 id="capture-title">Form capture</h2><span class="hint" id="capture-hint">Current page</span></div><div class="capture-body" id="capture"><div class="empty">Inspect the form to see its captured page here.</div></div></section>
      <section class="details" aria-labelledby="details-title"><div class="details-head"><h2 id="details-title">Application details</h2><span class="hint" id="review-version"></span></div><div class="details-body"><div class="meta"><div><span class="meta-label">CV variant</span><span class="meta-value" id="cv">Pending mapping</span></div><div><span class="meta-label">Employer</span><span class="meta-value" id="employer">—</span></div></div><div id="content"></div></div><div class="actions" id="actions"></div></section>
    </div>
  </main>
  <script>
    const attemptId=location.pathname.split('/').filter(Boolean).at(-1);
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const consentLabel=value=>/talent\s*pool|share|connected companies|group|consent|retention|data processing/i.test(value||'');
    let current=null;
    async function api(path,body){const response=await fetch(path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||`Request failed (${response.status})`);return data}
    function notice(text,error=false){const el=document.getElementById('message');el.hidden=!text;el.textContent=text||'';el.className='message'+(error?' error':'')}
    function controls(fields,answers){return fields.filter(f=>f.type!=='file').map((f,i)=>{const selector=f.selector;const value=answers?.[selector]??'';const label=esc(f.label||`Field ${i+1}`)+(f.required?' *':'');if(!selector)return `<div class="field"><label>${label}</label><small>This field needs manual review on the employer site.</small></div>`;const key=esc(selector);let input;if(f.tag==='select')input=`<select data-selector="${key}"><option value="">Choose an answer</option>${(f.options||[]).map(o=>`<option value="${esc(o.value)}" ${value===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;else if(f.type==='checkbox'||f.type==='radio')input=`<label class="checkrow"><input type="${f.type}" ${f.type==='radio'?`name="${esc(f.name||selector)}"`:''} data-selector="${key}" ${['true','yes','1','checked'].includes(String(value).toLowerCase())?'checked':''}> ${label}</label>`;else input=`<input data-selector="${key}" type="${['email','tel','number','date'].includes(f.type)?f.type:'text'}" value="${esc(value)}" autocomplete="off">`;const consent=consentLabel(f.label)?`<label class="checkrow consent-confirm"><input type="checkbox" data-approve-consent="${key}"> I approve this employer-specific choice</label>`:'';return `<div class="field">${f.type==='checkbox'||f.type==='radio'?'':`<label>${label}</label>`}${input}${consent}</div>`}).join('')}
    function render(){if(!current)return;const s=current.status,job=current.job||{};document.getElementById('title').textContent=job.title||'Application review';document.getElementById('company').textContent=job.company||'Company not listed';document.getElementById('employer').textContent=job.company||'—';const status=document.getElementById('status');status.textContent=s;status.dataset.status=s;document.getElementById('cv').textContent=job.cv_path?.split('/').at(-1)||`${job.profile_id||'Unclassified'} · PDF needed`;document.getElementById('review-version').textContent=current.review_version?`Review ${current.review_version}`:'';const stepNames=['Selected','Inspecting','Draft','ReadyForReview','Submitting'];const stepIndex=s==='SubmissionUnverified'?4:Math.max(0,stepNames.indexOf(s));document.getElementById('steps').innerHTML=stepNames.map((step,i)=>`<span class="step ${i===stepIndex?'current':''}">${esc(step==='ReadyForReview'?'Review':step)}</span>`).join('');const capture=document.getElementById('capture');capture.innerHTML=current.screenshot?`<img src="/api/applications/${encodeURIComponent(attemptId)}/capture?v=${encodeURIComponent(current.updated_at||'')}" alt="Captured application form for review">`:'<div class="empty">Inspect the form to see its captured page here.</div>';document.getElementById('capture-hint').textContent=current.form_title||'Current page';const review=current.review||[];document.getElementById('content').innerHTML=s==='ReadyForReview'||s==='Submitting'||s==='SubmissionUnverified'?`<div class="section-head"><h3>Answers to submit</h3><span class="hint">${review.length} items</span></div><dl>${review.map(item=>`<div class="answer"><dt>${esc(item.question)}</dt><dd>${esc(item.answer)}</dd></div>`).join('')}</dl>`:`<div class="section-head"><h3>Form questions</h3><span class="hint">${(current.fields||[]).length} found</span></div>${current.fields?.length?controls(current.fields,current.answers):'<p class="hint">Inspect the employer form to collect its questions.</p>'}`;const action=document.getElementById('actions');let buttons=[];if(['Selected','Inspecting','Draft','NeedsInput'].includes(s)){buttons.push('<button class="btn" data-action="inspect">Inspect form</button>');if(current.fields?.length)buttons.push('<button class="btn" data-action="save">Save answers</button>','<button class="btn primary" data-action="review">Prepare review</button>')}if(s==='ReadyForReview')buttons.push('<button class="btn" data-action="edit">Edit answers</button>','<button class="btn primary" data-action="submit">Approve and submit</button>');if(s==='SubmissionUnverified')buttons.push('<button class="btn primary" data-action="confirm">Confirm submitted</button>');buttons.push('<span class="spacer"></span>','<button class="btn danger" data-action="discard">Discard attempt</button>');action.innerHTML=buttons.join('');if(s==='SubmissionUnverified')notice('Submission may have reached the employer. Check the employer result before confirming. This attempt cannot be submitted again.');else if(job.warning||job.blocked_reason)notice(job.warning||job.blocked_reason);else notice('')}
    async function load(){current=await api(`/api/applications/${encodeURIComponent(attemptId)}`);render()}
    async function action(name){const base=`/api/applications/${encodeURIComponent(attemptId)}`;if(name==='inspect'){await api(`${base}/inspect`,{});await load();return}if(name==='save'||name==='review'){const answers={},approved=[];document.querySelectorAll('[data-selector]').forEach(el=>{if(el.type==='radio'){if(el.checked)answers[el.dataset.selector]='true'}else answers[el.dataset.selector]=el.type==='checkbox'?(el.checked?'true':'false'):el.value});document.querySelectorAll('[data-approve-consent]:checked').forEach(el=>approved.push(el.dataset.approveConsent));await api(`${base}/answers`,{answers,explicitly_approved_consent_fields:approved});if(name==='review')await api(`${base}/review`,{});await load();return}if(name==='edit'){await api(`${base}/inspect`,{});await load();return}if(name==='submit'){if(!confirm('Submit this reviewed application to the employer?'))return;const result=await api(`${base}/submit`,{review_digest:current.review_digest,explicit_user_approval:true});if(result.status==='Submitted'){location.href='/jobs';return}await load();return}if(name==='confirm'){if(!confirm('Have you verified that the employer received this application?'))return;await api(`${base}/confirm-submitted`,{explicit_user_confirmation:true});location.href='/jobs';return}if(name==='discard'){if(!confirm('Discard this attempt and erase its temporary data?'))return;await api(`${base}/discard`,{explicit_user_confirmation:true});location.href='/jobs'}}
    document.getElementById('actions').addEventListener('click',async e=>{const button=e.target.closest('button[data-action]');if(!button)return;document.querySelectorAll('.actions button').forEach(el=>el.disabled=true);try{await action(button.dataset.action)}catch(error){notice(error.message,true)}finally{document.querySelectorAll('.actions button').forEach(el=>el.disabled=false)}});
    load().catch(error=>notice(error.message,true));
  </script>
</body>
</html>
