<!doctype html>
<!-- Prototype question: Which hierarchy best presents the 50 highest fit scores while keeping posting recency and score notes visible? -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top scored jobs · Prototype</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182321;background:#f3f5f2;font-synthesis:none;text-rendering:optimizeLegibility;--muted:#71807b;--line:#e6ebe7;--green:#216b4b;--mint:#e8f3ec;--ink:#182321;--paper:#fff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}button,select{font:inherit}button{cursor:pointer}
    .shell{max-width:1440px;margin:auto;padding:34px 42px 100px}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px;color:var(--muted);font-size:12px;letter-spacing:.09em;text-transform:uppercase}.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink)}.mark{width:25px;height:25px;border-radius:8px;background:var(--green);display:grid;place-items:center;color:white;font-size:15px;letter-spacing:0}.prototype-tag{padding:7px 10px;border:1px solid #d5ded8;border-radius:999px;letter-spacing:.04em;text-transform:none;background:#f8faf8}
    .intro{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:25px}.eyebrow{margin:0 0 9px;color:var(--green);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(32px,4vw,48px);letter-spacing:-.055em;line-height:1.02;margin:0;font-weight:650}.subhead{margin:12px 0 0;color:var(--muted);font-size:15px}.controls{display:flex;align-items:center;gap:10px}.control{height:42px;border:1px solid #dce3de;border-radius:10px;background:var(--paper);padding:0 12px;color:var(--ink)}.refresh{padding:0 14px;font-weight:650}
    .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 22px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 19px}.stat-label{font-size:12px;color:var(--muted)}.stat-value{font-size:25px;letter-spacing:-.04em;font-weight:650;margin-top:8px}.stat-note{font-size:11px;color:var(--muted);margin-top:3px}
    .panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 28px rgba(32,54,41,.035)}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px 21px;border-bottom:1px solid var(--line)}.panel-title{font-weight:650;font-size:15px}.count{font-size:12px;color:var(--muted)}
    .table-wrap{overflow:auto}table{width:100%;min-width:940px;table-layout:fixed;border-collapse:collapse;text-align:left}th{font-size:10px;color:#78857f;text-transform:uppercase;letter-spacing:.09em;font-weight:700;padding:12px 14px;background:#fafbfa;white-space:nowrap}td{padding:15px 14px;border-top:1px solid #edf0ed;vertical-align:top;font-size:13px}tbody tr{transition:background .15s}tbody tr:hover{background:#f9fbf9}.job-title{font-size:14px;font-weight:650;color:var(--ink);text-decoration:none;line-height:1.35}.job-title:hover{color:var(--green);text-decoration:underline}.company{font-size:12px;color:var(--muted);margin-top:4px}.location{color:#5f6e68;white-space:nowrap}.score{font-size:18px;font-weight:700;letter-spacing:-.04em;color:var(--green);white-space:nowrap}.score-denom{font-size:11px;color:#8b9791;font-weight:500}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:var(--mint);color:#276647;font-size:11px;font-weight:650;white-space:nowrap}.notes{color:#4d5b55;line-height:1.55;white-space:pre-wrap;overflow:visible;overflow-wrap:anywhere}.date{white-space:nowrap;color:#53615b;font-variant-numeric:tabular-nums}
    .dashboard{display:block}.variant-b .shell{max-width:1540px}.variant-b .intro{align-items:start}.variant-b .dashboard{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px}.variant-b .side{display:flex;flex-direction:column;gap:10px}.variant-b .side .stat{padding:17px}.variant-b .stats{display:flex;flex-direction:column;margin:0}.variant-b td{padding-top:17px;padding-bottom:17px}
    .variant-c .shell{max-width:1440px}.variant-c .intro{align-items:start;flex-direction:column}.variant-c .controls{align-self:stretch;justify-content:space-between}.variant-c .stats{grid-template-columns:1fr 1fr 1fr}.variant-c th{background:white}.variant-c .panel{border:0;background:transparent;box-shadow:none}.variant-c .panel-head{padding:13px 3px}.variant-c tbody tr{background:white}.variant-c td:first-child{border-radius:12px 0 0 12px}.variant-c td:last-child{border-radius:0 12px 12px 0}.variant-c td{border-top:7px solid #f3f5f2;padding-top:16px;padding-bottom:16px}
    .empty,.error{padding:42px;text-align:center;color:var(--muted)}.loading{height:3px;background:linear-gradient(90deg,#c6dfce,#2e7b55,#c6dfce);background-size:200%;animation:load 1.2s linear infinite}@keyframes load{to{background-position:-200%}}
    .switcher{position:fixed;z-index:5;bottom:19px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:13px;padding:8px 11px;border-radius:999px;background:#182321;color:#fff;box-shadow:0 8px 30px #15241e40;font-size:12px}.switcher button{width:28px;height:28px;border:0;border-radius:50%;background:#33453d;color:#fff;font-size:17px}.switch-label{min-width:148px;text-align:center}.switch-label b{color:#bce0c8}.switcher button:hover{background:#4c685a}
    @media(max-width:850px){.shell{padding:24px 18px 90px}.intro{align-items:start;flex-direction:column}.controls{width:100%}.controls select{flex:1}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat{padding:12px}.stat-value{font-size:21px}.variant-b .dashboard{grid-template-columns:1fr}.variant-b .side{display:grid;grid-template-columns:repeat(3,1fr)}.variant-b .stat{padding:12px}.notes{min-width:240px}}
    @media(max-width:560px){.topline{margin-bottom:26px}.prototype-tag{font-size:11px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}.variant-b .side{grid-template-columns:1fr 1fr}.variant-b .side .stat:last-child{grid-column:span 2}.variant-c .stats{grid-template-columns:1fr 1fr}.variant-c .stats .stat:last-child{grid-column:span 2}.controls{flex-wrap:wrap}.controls select{min-width:150px}.panel-head{padding:15px}.switch-label{min-width:130px}}
  </style>
</head>
<body class="variant-a">
  <main class="shell">
    <div class="topline"><div class="brand"><span class="mark">↗</span> Job search <span style="color:#a4aea8;font-weight:400">/ Fit scores</span></div><div><a href="/status" style="color:#216b4b;font-weight:650;text-decoration:none;margin-right:16px">Workflow status</a><span class="prototype-tag">Prototype · read only</span></div></div>
    <header class="intro"><div><p class="eyebrow">Your shortlist</p><h1>Top fit scores</h1><p class="subhead">The strongest matches, with the posting date in view.</p></div><div class="controls"><select class="control" id="sort"><option value="score">Highest score</option><option value="recent">Most recently posted</option></select><button class="control refresh" id="refresh">↻ &nbsp; Refresh</button></div></header>
    <div class="dashboard"><aside class="side"><section class="stats" id="stats"></section></aside>
    <section class="panel"><div class="panel-head"><span class="panel-title">Scored opportunities</span><span class="count" id="count">Loading…</span></div><div class="loading" id="loading"></div><div class="table-wrap" id="results"></div></section></div>
  </main>
  <nav class="switcher" aria-label="Prototype layout variants"><button id="prev" aria-label="Previous layout">‹</button><span class="switch-label" id="variant-label"></span><button id="next" aria-label="Next layout">›</button></nav>
<script>
  const variants=[['a','A · Leaderboard'],['b','B · Analyst split'],['c','C · Editorial list']];
  const names=Object.fromEntries(variants.map(([key,name])=>[key,name]));
  let scored=[];
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dateValue=value=>value?new Date(value+'T00:00:00'):null;
  const prettyDate=value=>{const d=dateValue(value);return d&&!Number.isNaN(d.valueOf())?new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric'}).format(d):'Date unknown'};
  function setVariant(key){if(!names[key])key='a';document.body.className='variant-'+key;document.getElementById('variant-label').innerHTML=`<b>${key.toUpperCase()}</b> &nbsp; ${names[key].slice(4)}`;const url=new URL(location.href);url.searchParams.set('variant',key);history.replaceState({},'',url)}
  function tableRows(rows){return rows.map(j=>`<tr><td class="date">${prettyDate(j.posted_at)}</td><td><a class="job-title" href="${esc(j.job_url||'#')}" target="_blank" rel="noreferrer">${esc(j.title||'Untitled role')}</a><div class="company">${esc(j.company||'Company not listed')}</div></td><td><span class="score">${Number(j.overall_fit??0).toFixed(1)}<span class="score-denom"> / 100</span></span><div style="margin-top:7px"><span class="badge">${esc(j.fit_category||'Scored')}</span></div></td><td><div class="notes">${esc(j.fit_explanation||'No score notes saved')}</div></td></tr>`).join('')}
  function render(){const sort=document.getElementById('sort').value;const rows=[...scored].sort((a,b)=>sort==='recent'?String(b.posted_at||'').localeCompare(String(a.posted_at||''))||Number(b.overall_fit||0)-Number(a.overall_fit||0):Number(b.overall_fit||0)-Number(a.overall_fit||0)||String(b.posted_at||'').localeCompare(String(a.posted_at||''))).slice(0,50);const high=rows[0]?.overall_fit;const avg=rows.length?rows.reduce((n,j)=>n+Number(j.overall_fit||0),0)/rows.length:0;document.getElementById('stats').innerHTML=`<article class="stat"><div class="stat-label">Showing</div><div class="stat-value">${rows.length}<span style="font-size:14px;color:#8b9791"> / 50</span></div><div class="stat-note">highest scoring jobs</div></article><article class="stat"><div class="stat-label">Top fit score</div><div class="stat-value">${high==null?'—':Number(high).toFixed(1)}</div><div class="stat-note">out of 100</div></article><article class="stat"><div class="stat-label">Average fit</div><div class="stat-value">${rows.length?avg.toFixed(1):'—'}</div><div class="stat-note">within this shortlist</div></article>`;document.getElementById('count').textContent=`${rows.length} result${rows.length===1?'':'s'} · max 50`;document.getElementById('results').innerHTML=rows.length?`<table><colgroup><col style="width:12%"><col style="width:27%"><col style="width:12%"><col style="width:49%"></colgroup><thead><tr><th>Posted at</th><th>Title</th><th>Fit score</th><th>Score notes</th></tr></thead><tbody>${tableRows(rows)}</tbody></table>`:'<div class="empty">No scored jobs yet. Completed fit assessments will appear here.</div>';}
  async function load(){document.getElementById('loading').hidden=false;document.getElementById('count').textContent='Loading…';try{const response=await fetch('/api/jobs?limit=500&offset=0&fit_status=Scored');if(!response.ok)throw new Error(`Jobs request returned ${response.status}`);const payload=await response.json();scored=(payload.jobs||[]).filter(j=>j.overall_fit!=null);render()}catch(error){document.getElementById('count').textContent='Could not load jobs';document.getElementById('results').innerHTML=`<div class="error">${esc(error.message)}<br><small>Open this prototype from the running job-scraper API.</small></div>`}finally{document.getElementById('loading').hidden=true}}
  document.getElementById('sort').addEventListener('change',render);document.getElementById('refresh').addEventListener('click',load);document.getElementById('prev').addEventListener('click',()=>cycle(-1));document.getElementById('next').addEventListener('click',()=>cycle(1));function cycle(delta){const current=new URL(location.href).searchParams.get('variant')||'a';const idx=variants.findIndex(([key])=>key===current);setVariant(variants[(idx+delta+variants.length)%variants.length][0])}window.addEventListener('keydown',event=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(event.key==='ArrowLeft')cycle(-1);if(event.key==='ArrowRight')cycle(1)});setVariant(new URL(location.href).searchParams.get('variant')||'a');load();
</script>
</body>
</html>
