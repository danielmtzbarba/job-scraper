<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Applications · Job search</title>
<style>:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182321;background:#f3f5f2}*{box-sizing:border-box}body{margin:0}.shell{max-width:1200px;margin:auto;padding:35px 25px}a{color:#216b4b}nav{display:flex;gap:22px;font-size:13px;font-weight:650}h1{font-size:38px;letter-spacing:-.04em;margin:32px 0 6px}p{color:#607069}.filters{display:flex;gap:8px;margin:27px 0 18px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid #cbd9cf;border-radius:8px;background:#fff;padding:9px 13px;color:#24382c}button[aria-pressed=true]{background:#216b4b;color:white}.panel{background:white;border:1px solid #dfe7e0;border-radius:13px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:750px;text-align:left}th{background:#f8faf8;color:#68786d;text-transform:uppercase;letter-spacing:.08em;font-size:11px}th,td{padding:15px;border-bottom:1px solid #e8eee9}td{font-size:13px}td strong{display:block;font-size:14px}.muted{color:#69776f}.action{font-weight:650;white-space:nowrap}.empty{padding:35px;color:#607069}@media(max-width:700px){.shell{padding:22px 15px}h1{font-size:31px}}</style></head><body><main class="shell"><nav><a href="/jobs">Jobs</a><a href="/applications" aria-current="page">Applications</a><a href="/status">Workflow status</a></nav><h1>Applications</h1><p>Progress and content-free history for submitted and discarded attempts. Completed answers and captures are erased on closure.</p><div class="filters"><button data-filter="active" aria-pressed="true">Active and review needed</button><button data-filter="submitted" aria-pressed="false">Submitted</button><button data-filter="discarded" aria-pressed="false">Discarded</button><button data-filter="all" aria-pressed="false">All</button></div><div class="panel" id="results"><div class="empty">Loading applications…</div></div></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let items=[],filter=new URL(location.href).searchParams.get('filter')||'active';const label=s=>s==='Discarded'?'View audit':s==='Submitted'?'View submission':s==='SubmissionUnverified'||s==='Submitting'?'Verify submission':s==='ReadyForReview'?'Review application':'Continue application';function render(){const shown=items.filter(x=>filter==='all'||(filter==='submitted'?x.status==='Submitted':filter==='discarded'?x.status==='Discarded':!['Submitted','Discarded'].includes(x.status)));document.getElementById('results').innerHTML=shown.length?`<table><thead><tr><th>Job and employer</th><th>Fit</th><th>Process state</th><th>Last update</th><th>Next action</th></tr></thead><tbody>${shown.map(x=>`<tr><td><strong>${esc(x.title||'Untitled role')}</strong><span class="muted">${esc(x.company||'Employer unknown')}</span></td><td>${x.overall_fit==null?'—':Number(x.overall_fit).toFixed(1)}</td><td>${esc(x.status)}</td><td>${esc(x.updated_at?.slice(0,16).replace('T',' ')||'—')}</td><td><a class="action" href="/applications/${encodeURIComponent(x.id)}">${label(x.status)}</a></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No applications in this view.</div>';document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)))}document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));fetch('/api/applications',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`Request failed (${r.status})`);return r.json()}).then(d=>{items=d.applications||[];render()}).catch(e=>document.getElementById('results').innerHTML=`<div class="empty">${esc(e.message)}</div>`);
</script></body></html>
