[project]
name = "job-scraper"
version = "0.1.0"
description = "Local-first job discovery and application tracking agent"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cloud-sql-python-connector[pg8000]>=1.19.0",
    "curl-cffi>=0.16.3",
    "fastapi>=0.142.2",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.0.0,<3.0.0",
    "playwright>=1.63.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.32",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_scraper"]

[project.scripts]
job-scraper-mcp = "job_scraper.mcp.server:main"
job-scraper-score = "job_scraper.application.scoring_worker:main"
